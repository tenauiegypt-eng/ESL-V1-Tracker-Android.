name: Build ESL V1 Tracker APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'ESL_V1_Tracker_Android_Studio_Source.zip'
      - '.github/workflows/build-apk.yml'
jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      
        
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: unzip -q ESL_V1_Tracker_Android_Studio_Source.zip
      - name: Build debug APK
        working-directory: ESL_V1_Tracker_Android
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ESL_V1_Tracker_Android_APK
          path: ESL_V1_Tracker_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
